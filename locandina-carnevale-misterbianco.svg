<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07182e"/>
      <stop offset="50%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#133863"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Decorative Carnival Confetti Shapes -->
  <circle cx="80" cy="90" r="12" fill="#ec4899" opacity="0.6"/>
  <circle cx="720" cy="120" r="16" fill="#f59e0b" opacity="0.6"/>
  <circle cx="120" cy="280" r="8" fill="#3b82f6" opacity="0.5"/>
  <circle cx="680" cy="320" r="14" fill="#a855f7" opacity="0.6"/>
  <circle cx="60" cy="650" r="10" fill="#10b981" opacity="0.5"/>
  <circle cx="740" cy="720" r="12" fill="#ec4899" opacity="0.5"/>

  <!-- Header Banner Sicily Palermo Tour -->
  <rect x="40" y="30" width="720" height="90" rx="16" fill="#031124" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#dropShadow)"/>
  <text x="400" y="70" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="url(#goldGrad)" letter-spacing="2">
    ★ SICILY PALERMO TOUR ★
  </text>
  <text x="400" y="100" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#94a3b8" letter-spacing="1">
    ESCURSIONI IN BUS GT &amp; EVENTI IN SICILIA
  </text>

  <!-- Main Title Banner -->
  <rect x="40" y="145" width="720" height="175" rx="20" fill="url(#purpleGrad)" filter="url(#dropShadow)"/>
  <rect x="45" y="150" width="710" height="165" rx="16" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="8,4"/>

  <text x="400" y="195" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#fef08a" letter-spacing="1.5">
    🎭🛍️ GRANDE EVENTO IN BUS GT 🛍️🎭
  </text>
  <text x="400" y="245" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="#ffffff" filter="url(#dropShadow)">
    CARNEVALE DI MISTERBIANCO
  </text>
  <text x="400" y="295" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="32" fill="url(#goldGrad)">
    &amp; IKEA CATANIA
  </text>

  <!-- Date & Price Row -->
  <g transform="translate(40, 340)">
    <!-- Date Box -->
    <rect x="0" y="0" width="345" height="100" rx="16" fill="url(#badgeGrad)" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="172" y="38" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#64748b">
      📅 DATA DELL'EVENTO
    </text>
    <text x="172" y="76" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#0b2545">
      7 FEBBRAIO
    </text>

    <!-- Price Box -->
    <rect x="375" y="0" width="345" height="100" rx="16" fill="url(#goldGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="547" y="38" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#78350f">
      🚌 BUS A/R A PERSONA
    </text>
    <text x="547" y="78" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#000000">
      € 30,00
    </text>
  </g>

  <!-- Pickup Points Header -->
  <rect x="40" y="465" width="720" height="45" rx="10" fill="#0284c7"/>
  <text x="400" y="494" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="1">
    📍 PUNTI DI RACCOLTA &amp; ORARI PARTENZA:
  </text>

  <!-- Pickup Cards Grid -->
  <g transform="translate(40, 525)">
    <!-- Giotto -->
    <rect x="0" y="0" width="225" height="85" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="112" y="32" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="17" fill="#0369a1">
      PIAZZALE GIOTTO
    </text>
    <text x="112" y="64" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#0f172a">
      ⏰ ORE 10:00
    </text>

    <!-- Villabate -->
    <rect x="247" y="0" width="225" height="85" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="360" y="32" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="17" fill="#0369a1">
      VILLABATE
    </text>
    <text x="360" y="64" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#0f172a">
      ⏰ ORE 10:20
    </text>

    <!-- Bagheria -->
    <rect x="495" y="0" width="225" height="85" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#dropShadow)"/>
    <text x="607" y="32" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="17" fill="#0369a1">
      BAGHERIA
    </text>
    <text x="607" y="64" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#0f172a">
      ⏰ ORE 10:40
    </text>
  </g>

  <!-- Program Details Box -->
  <rect x="40" y="630" width="720" height="215" rx="16" fill="#ffffff" opacity="0.97" stroke="#cbd5e1" stroke-width="2" filter="url(#dropShadow)"/>

  <text x="70" y="668" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="20" fill="#0b2545">
    📋 PROGRAMMA DELLA GIORNATA:
  </text>
  <line x1="70" y1="680" x2="730" y2="680" stroke="#e2e8f0" stroke-width="2"/>

  <text x="70" y="715" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#1e293b">
    🛒 MATTINA: Incontro con il coordinatore e partenza in Bus GT verso Catania.
  </text>
  <text x="96" y="740" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#475569">
    Sosta all'IKEA di Catania con tempo libero per shopping, arredamento e idee regalo.
  </text>

  <text x="70" y="780" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#1e293b">
    🎭 POMERIGGIO: Trasferimento al famoso Carnevale di Misterbianco.
  </text>
  <text x="96" y="805" font-family="'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#475569">
    Sfilate dei costumi più belli di Sicilia, maschere, musica e festa! Rientro in serata.
  </text>

  <!-- Footer Contact Box -->
  <rect x="40" y="865" width="720" height="105" rx="16" fill="url(#goldGrad)" filter="url(#dropShadow)"/>
  <text x="400" y="902" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#000000">
    📞 INFO &amp; PRENOTAZIONI: SICILY PALERMO TOUR
  </text>
  <text x="400" y="934" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#1e293b">
    💬 WhatsApp: +39 340 1234567  |  🌐 sicilypalermotours.com
  </text>
  <text x="400" y="958" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#3b0764">
    ✉️ pilotaintour13@gmail.com
  </text>
</svg>
